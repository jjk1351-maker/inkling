<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>슬독생 · 슬기로운 독서 생활</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    html,body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;background:#f9fafb;color:#1f2937}
    #auth{max-width:420px;margin:7vh auto;padding:0 16px}
    #auth .box{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px 24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    #auth h1{margin:0 0 4px;font-size:26px;text-align:center}
    #auth .sub{margin:0 0 18px;text-align:center;color:#6b7280;font-size:14px}
    #auth .tabs{display:flex;gap:6px;margin-bottom:14px}
    #auth .tabs button{flex:1;padding:10px 0;border:1px solid #e5e7eb;background:#f3f4f6;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:#4b5563}
    #auth .tabs button.on{background:#10b981;color:#fff;border-color:#10b981}
    #auth label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:#374151}
    #auth input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;font-size:16px}
    #auth .hint{font-size:12px;color:#6b7280;margin:4px 0 0}
    #auth .go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#10b981;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
    #auth .go:disabled{opacity:.5}
    #auth .err{min-height:20px;margin:10px 0 0;color:#dc2626;font-size:14px;text-align:center}
    #auth .note{margin-top:14px;font-size:12px;color:#6b7280;text-align:center;line-height:1.6}
    .boot{text-align:center;margin-top:30vh;color:#6b7280}
    #foot{padding:18px 12px 22px;text-align:center;font-size:12px;letter-spacing:.02em;color:#9ca3af}
    body:has(.rdw) #foot{display:none}
  </style>
  <script>document.documentElement.dataset.boot = '1'</script>
</head>
<body>
  <div id="auth"></div>
  <header id="top" hidden>
    <button id="sideBtn" class="ib" aria-label="목차 열고 닫기" hidden></button>
    <div class="brand">슬독생</div>
    <span id="roleChip" class="pill em"></span>
    <span class="spacer"></span>
    <button id="logoutBtn" class="btn small">나가기</button>
  </header>
  <div id="layout" hidden>
    <aside id="side" hidden></aside>
    <main id="app"><p class="loading">불러오는 중…</p></main>
  </div>
  <footer id="foot">© Seuldoksaeng Portal · Powered by JK &amp; SH</footer>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';
    const SERVER = 'https://script.google.com/macros/s/AKfycby7vQTzAnTqEKDkJBuO5oUsTbtj-Vy8ARPH0JZXFF7vKpmOxq11zBUanFDzEqZ94BURDQ/exec', BUILD = 'h0Blng';
    const $ = s => document.querySelector(s);
    const auth = $('#auth');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* ---------- 서버 통신 (text/plain 이라 사전 요청 없이 전송) ---------- */
    async function api(action, body) {
      let res;
      try {
        res = await fetch(SERVER, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, body || {})) });
      } catch (e) { return { ok: false, error: '인터넷 연결을 확인해 주세요.', net: true }; }
      try { return await res.json(); } catch (e) { return { ok: false, error: '서버 응답을 읽지 못했어요. 잠시 뒤 다시 해 주세요.', net: true }; }
    }

    /* ---------- 복호화 (AES-GCM) ---------- */
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const keyCache = {};
    async function key(b) { return keyCache[b] || (keyCache[b] = await crypto.subtle.importKey('raw', b64(b), 'AES-GCM', false, ['decrypt'])); }
    async function dec(buf, keyB64) {
      const u = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, await key(keyB64), u.slice(12));
    }
    const getBin = async p => { const r = await fetch(p + '?v=' + BUILD); if (!r.ok) throw new Error(p); return r.arrayBuffer(); };

    /* ---------- 로그인 화면 ---------- */
    let tab = 'login', who = 'kid';
    function drawAuth(msg) {
      const isG = who === 'guardian';
      let form = '';
      if (tab === 'login') {
        form = `<div class="tabs"><button data-who="kid" class="${isG ? '' : 'on'}">학생</button><button data-who="guardian" class="${isG ? 'on' : ''}">보호자</button></div>
          <label for="fc">가족코드</label><input id="fc" autocomplete="off" autocapitalize="characters">
          ${isG ? '' : '<label for="nm">내 이름</label><input id="nm" autocomplete="off" maxlength="10">'}
          <label for="pn">${isG ? '보호자 비밀번호' : '내 비밀번호 (숫자 4자리)'}</label><input id="pn" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
          <button class="go" id="go">들어가기</button>`;
      } else {
        form = `<div class="tabs"><button data-who="kid" class="${isG ? '' : 'on'}">학생 가입</button><button data-who="guardian" class="${isG ? 'on' : ''}">보호자: 가족 만들기</button></div>`;
        if (!isG) form += `<label for="fc">가족코드</label><input id="fc" autocomplete="off" autocapitalize="characters"><p class="hint">보호자에게 가족코드를 물어보세요.</p>
          <label for="nm">내 이름 (친구들에게 보여요. 별명도 좋아요)</label><input id="nm" autocomplete="off" maxlength="10">
          <label for="pn">비밀번호 (숫자 4자리)</label><input id="pn" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <label for="pn2">비밀번호 확인</label><input id="pn2" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
          <button class="go" id="go">가입하고 시작하기</button>`;
        else form += `<label for="sk">가입 열쇠</label><input id="sk" type="password" autocomplete="off"><p class="hint">처음 안내받은 열쇠 말을 입력하세요.</p>
          <label for="fc">우리 가족코드 (3~12자, 한글·영문·숫자)</label><input id="fc" autocomplete="off" autocapitalize="characters"><p class="hint">아이들이 가입할 때 쓰는 코드예요.</p>
          <label for="fn">가족 이름 (선택)</label><input id="fn" maxlength="20" autocomplete="off">
          <label for="pn">보호자 비밀번호 (숫자 4~6자리)</label><input id="pn" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
          <label for="pn2">비밀번호 확인</label><input id="pn2" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
          <button class="go" id="go">가족 만들고 시작하기</button>`;
      }
      auth.innerHTML = `<div class="box"><h1>슬독생</h1><p class="sub">${tab === 'login' ? '슬기로운 독서 생활 · 초등 탐구 독서' : '처음이면 가입해요'}</p>
        ${form}<p class="err" id="err">${esc(msg || '')}</p>
        <div class="note">${tab === 'login' ? '처음이에요? <a href="#" id="toggle">가입하기</a>' : '이미 가입했어요? <a href="#" id="toggle">로그인</a>'}</div></div>`;
      auth.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { who = b.dataset.who; drawAuth(); });
      $('#toggle').onclick = e => { e.preventDefault(); tab = tab === 'login' ? 'signup' : 'login'; drawAuth(); };
      $('#go').onclick = submit;
      auth.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') submit(); });
    }
    const val = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
    async function submit() {
      const btn = $('#go'), err = $('#err'); err.textContent = '';
      const g = who === 'guardian', fc = val('fc'), pn = val('pn');
      let action, body;
      if (tab === 'login') {
        if (!fc || !pn || (!g && !val('nm'))) { err.textContent = '모두 입력해 주세요.'; return; }
        action = g ? 'guardianLogin' : 'login'; body = { familyCode: fc, name: val('nm'), pin: pn };
      } else {
        if (pn !== val('pn2')) { err.textContent = '비밀번호가 서로 달라요.'; return; }
        if (g) { if (!val('sk') || !fc || !pn) { err.textContent = '필수 칸을 모두 입력해 주세요.'; return; } action = 'registerFamily'; body = { signupKey: val('sk'), familyCode: fc, familyName: val('fn'), guardianPin: pn }; }
        else { if (!fc || !val('nm') || !pn) { err.textContent = '모두 입력해 주세요.'; return; } action = 'registerKid'; body = { familyCode: fc, name: val('nm'), pin: pn }; }
      }
      btn.disabled = true; btn.textContent = '확인하는 중…';
      const res = await api(action, body);
      if (!res.ok) { btn.disabled = false; btn.textContent = '다시 해 보기'; err.textContent = res.error || '실패했어요.'; return; }
      const sess = { role: g ? 'guardian' : 'kid', token: res.token, kid: res.kid || null, fam: res.family || null, keys: res.keys, famCode: g ? (res.family && res.family.code) : fc.toUpperCase() };
      try { sessionStorage.setItem('rs', JSON.stringify(sess)); } catch (e) { /* ignore */ }
      start(sess);
    }

    /* ---------- 열쇠로 풀어서 앱 시작 ---------- */
    async function start(s) {
      auth.innerHTML = '<p class="boot">열쇠로 책장을 여는 중…</p>';
      try {
        const [c, a, st, gd] = await Promise.all([
          getBin('content.bin').then(b => dec(b, s.keys.kid)), getBin('app.bin').then(b => dec(b, s.keys.kid)),
          getBin('style.bin').then(b => dec(b, s.keys.kid)), s.keys.guardian ? getBin('guard.bin').then(b => dec(b, s.keys.guardian)) : null]);
        const T = new TextDecoder();
        const css = document.createElement('style'); css.textContent = T.decode(st); document.head.appendChild(css);
        const imgs = {};
        window.__CTX = {
          role: s.role, kid: s.kid, fam: s.fam, famCode: s.famCode,
          content: JSON.parse(T.decode(c)), guard: gd ? JSON.parse(T.decode(gd)) : null,
          api: async (action, body) => {
            const r = await api(action, Object.assign({ token: s.token }, body || {}));
            if (!r.ok && /다시 로그인|로그인 시간/.test(r.error || '')) { try { sessionStorage.clear(); } catch (e) { /* ignore */ } location.reload(); }
            return r;
          },
          img: async id => {
            if (imgs[id]) return imgs[id];
            try { const b = await dec(await getBin('img/' + id + '.bin'), s.keys.kid); return (imgs[id] = URL.createObjectURL(new Blob([b], { type: 'image/webp' }))); } catch (e) { return null; }
          },
        };
        window.__logout = () => { try { sessionStorage.clear(); } catch (e) { /* ignore */ } location.reload(); };
        auth.remove(); $('#layout').hidden = false;
        (0, eval)(T.decode(a));
      } catch (e) {
        try { sessionStorage.clear(); } catch (x) { /* ignore */ }
        drawAuth('앱을 여는 데 실패했어요. 다시 로그인해 주세요.'); console.error(e);
      }
    }

    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('rs') || 'null'); } catch (e) { /* ignore */ }
    if (saved && saved.keys) start(saved); else drawAuth();
  })();
  </script>
</body>
</html>
